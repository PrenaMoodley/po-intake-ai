[project]
name = "po-intake"
version = "0.1.0"
description = "Turn customer purchase orders into checked, ERP-ready sales order data with the Claude API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13,<2",
    "pydantic>=2.7,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
po-intake = "po_intake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/po_intake"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
